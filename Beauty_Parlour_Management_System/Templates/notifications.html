{% extends 'base.html' %}{% block content %}<main class='container py-4'><h1>Your updates</h1><form method="post" class="mb-3">{% csrf_token %}<button class="btn btn-outline-dark">Mark all as read</button></form>{% for item in page %}<article class="card p-3 mb-2"><small>{{ item.created_at }}{% if not item.read %} · New{% endif %}</small><p>{{ item.text }}</p><a href="{{ item.link }}">View details</a></article>{% empty %}<p>No updates yet.</p>{% endfor %}{% include 'pagination.html' %}</main>{% endblock %}
