{% extends 'base.html' %}{% block content %}<div class='container py-5'><nav class="d-flex flex-wrap gap-2 mb-4" aria-label="Staff navigation"><a class="btn btn-outline-dark" href="{% url 'dashboard' %}">Overview & appointments</a><a class="btn btn-outline-dark" href="{% url 'staff_list' %}">Staff & leave</a><a class="btn btn-outline-dark" href="{% url 'service_list' %}">Services</a><a class="btn btn-outline-dark" href="{% url 'inbox' %}">Messages</a></nav><h1>Manage services</h1><a class="btn btn-book mb-4" href="{% url 'service_add' %}">Add service</a><div class="table-responsive"><table class="table"><thead><tr><th>Service</th><th>Price</th><th>Duration</th><th></th></tr></thead><tbody>{% for s in services %}<tr><td>{{ s.name }}</td><td>₹{{ s.price }}</td><td>{{ s.duration }} min</td><td><a href="{% url 'service_edit' s.pk %}">Edit</a></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
